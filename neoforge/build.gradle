plugins {
    id 'com.github.johnrengelman.shadow'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
    maven { url = 'https://maven.createmod.net' }
    maven { url = 'https://maven.ithundxr.dev/snapshots' }
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"

    // Architectury
    modImplementation "dev.architectury:architectury-neoforge:$rootProject.architectury_api_version"

    // Create Mod Dependencies
    modImplementation("com.simibubi.create:create-${rootProject.minecraft_version}:${rootProject.nf_create_version}:slim") { transitive = false }
    modImplementation "net.createmod.ponder:ponder-neoforge:${rootProject.nf_ponder_version}+mc${rootProject.minecraft_version}"
    modCompileOnly "dev.engine-room.flywheel:flywheel-neoforge-api-${rootProject.minecraft_version}:${rootProject.nf_flywheel_version}"
    modRuntimeOnly "dev.engine-room.flywheel:flywheel-neoforge-${rootProject.minecraft_version}:${rootProject.nf_flywheel_version}"
    modImplementation "com.tterrag.registrate:Registrate:${rootProject.nf_registrate_version}"

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    input.set shadowJar.archiveFile
}
